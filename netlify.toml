# UniSjak – Netlify
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Disse værdier er offentlige og står bevidst i index.html / kommentarer. Hemmelige nøgler (RESEND_API_KEY,
# RESEND_WEBHOOK_SECRET, SUPABASE_SERVICE_ROLE_KEY) må ALDRIG stå her – de scannes stadig.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,RESEND_FROM_EMAIL"
